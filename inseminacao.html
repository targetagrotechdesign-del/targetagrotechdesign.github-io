  <style>
    :root {
      --background: #06160f;
      --background-alt: #0b2416;
      --card: #10251a;
      --card-soft: #102a1f;
      --border: #1f3b29;
      --primary: #00b050;
      --primary-soft: #0fd266;
      --secondary: #f2c94c;
      --text-main: #f5f5f5;
      --text-muted: #c1c9c5;
      --radius-lg: 18px;
      --radius-md: 12px;
      --shadow-soft: 0 18px 40px rgba(0, 0, 0, 0.55);
      --shadow-card: 0 12px 26px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #0e2a1d 0, #020a06 45%, #020805 100%);
      color: var(--text-main);
      line-height: 1.5;
      position: relative;
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 320px;
      height: 320px;
      border-radius: 999px;
      filter: blur(30px);
      opacity: 0.45;
      z-index: -1;
      pointer-events: none;
    }

    body::before {
      top: -120px;
      right: -80px;
      background: radial-gradient(circle at center, rgba(0, 176, 80, 0.5), transparent 70%);
    }

    body::after {
      bottom: -140px;
      left: -90px;
      background: radial-gradient(circle at center, rgba(242, 201, 76, 0.4), transparent 70%);
    }

    img {
      max-width: 100%;
      display: block;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .page {
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    section {
      padding: 4rem 0;
    }

    @media (min-width: 1024px) {
      section {
        padding: 5rem 0;
      }
    }

    .section-title {
      font-size: clamp(2.1rem, 3vw, 2.6rem);
      margin-bottom: 0.9rem;
      text-align: center;
      position: relative;
    }

    .section-title span.highlight {
      color: var(--primary);
    }

    .section-title::after {
      content: "";
      display: block;
      width: 80px;
      height: 2px;
      margin: 0.7rem auto 0;
      background: linear-gradient(to right, transparent, var(--secondary), transparent);
    }

    .section-subtitle {
      text-align: center;
      color: var(--text-muted);
      max-width: 680px;
      margin: 0 auto 2.4rem;
      font-size: 1rem;
    }

    .btn {
      padding: 0.9rem 1.7rem;
      border-radius: 999px;
      font-size: 1rem;
      font-weight: 600;
      border: 1px solid transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      transition:
        transform 0.12s ease-out,
        box-shadow 0.12s ease-out,
        background 0.12s ease-out,
        border-color 0.12s ease-out,
        opacity 0.12s ease-out;
      white-space: nowrap;
    }

    .btn-primary {
      background: var(--primary);
      color: #020a06;
      box-shadow: var(--shadow-soft);
    }

    .btn-primary:hover {
      background: var(--primary-soft);
      transform: translateY(-1px);
      box-shadow: 0 18px 40px rgba(18, 242, 120, 0.27);
    }

    .btn-outline {
      background: transparent;
      border-color: var(--border);
      color: var(--text-main);
    }

    .btn-outline:hover {
      border-color: var(--primary);
      background: rgba(0, 176, 80, 0.08);
      transform: translateY(-1px);
    }

    .btn-ghost {
      background: transparent;
      border-color: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
    }

    .btn-ghost:hover {
      border-color: var(--secondary);
      color: var(--secondary);
      transform: translateY(-1px);
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
    }

    .btn-small {
      padding: 0.6rem 1.1rem;
      font-size: 0.86rem;
    }

    .hidden {
      display: none !important;
    }

    /* utilitários */
    .mb-1_5 {
      margin-bottom: 1.5rem;
    }

    .center {
      justify-content: center;
    }

    /* ========== HEADER / TOP BAR ========== */

    header {
      padding: 1.2rem 0 0.5rem;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.4rem;
    }

    .top-bar-left {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      font-size: 0.9rem;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.88rem;
      color: var(--text-muted);
      padding: 0.4rem 0.9rem;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      background: rgba(0, 0, 0, 0.2);
      cursor: pointer;
    }

    .back-link:hover {
      border-color: var(--primary);
      color: var(--primary-soft);
    }

    .top-bar-right {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .pill-label {
      padding: 0.28rem 0.75rem;
      border-radius: 999px;
      border: 1px solid rgba(242, 201, 76, 0.4);
      color: var(--secondary);
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    /* ========== HERO DO CURSO ========== */

    .hero-course {
      padding: 1.5rem 0 3rem;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr);
      gap: 2.4rem;
      align-items: center;
    }

    @media (max-width: 900px) {
      .hero-grid {
        grid-template-columns: 1fr;
      }
    }

    .hero-course-kicker {
      font-size: 0.88rem;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--secondary);
      margin-bottom: 0.7rem;
    }

    .hero-course-title {
      font-size: clamp(2.1rem, 3.3vw, 2.7rem);
      font-weight: 700;
      margin-bottom: 0.7rem;
    }

    .hero-course-title span {
      color: var(--primary);
    }

    .hero-course-subtitle {
      color: var(--text-muted);
      font-size: 1rem;
      margin-bottom: 1.2rem;
      max-width: 560px;
    }

    .hero-course-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem;
      margin-bottom: 1.5rem;
      font-size: 0.86rem;
    }

    .hero-course-tag {
      padding: 0.35rem 0.9rem;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: radial-gradient(circle at top left, rgba(0, 176, 80, 0.22), rgba(0, 0, 0, 0.7));
    }

    .hero-course-info-row {
      margin-top: 1.6rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1.4rem;
      font-size: 0.86rem;
      color: var(--text-muted);
    }

    .hero-course-info-item span {
      display: block;
    }

    .hero-course-info-item strong {
      color: var(--primary-soft);
      font-size: 1rem;
    }

    .hero-course-media {
      background: radial-gradient(circle at top, #152c1f, #07130d);
      border-radius: 28px;
      padding: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: var(--shadow-card);
      position: relative;
      overflow: hidden;
    }

    .hero-course-media::before {
      content: "Curso oficial Target Agrotech";
      position: absolute;
      top: 1rem;
      left: 1rem;
      font-size: 0.75rem;
      padding: 0.3rem 0.7rem;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(242, 201, 76, 0.6);
      color: var(--secondary);
      z-index: 2;
    }

    .hero-slider {
      position: relative;
      border-radius: 22px;
      overflow: hidden;
      max-height: 360px;
      min-height: 260px;
    }

    .hero-slide-img {
      width: 100%;
      height: 360px;
      object-fit: cover;
      object-position: 50% 60% !important;
      display: block;
    }

    .hero-course-media-footer {
      margin-top: 0.8rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    .hero-course-media-footer strong {
      color: var(--primary-soft);
    }

    /* ========== POR QUE CURSO ========== */

    .why-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1.4rem;
    }

    @media (max-width: 900px) {
      .why-grid {
        grid-template-columns: 1fr;
      }
    }

    .why-card {
      background: rgba(5, 33, 19, 0.95);
      border-radius: var(--radius-md);
      padding: 1.4rem 1.3rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      transition:
        transform 0.16s ease-out,
        box-shadow 0.16s ease-out,
        border-color 0.16s ease-out;
    }

    .why-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 18px 36px rgba(0, 0, 0, 0.78);
      border-color: rgba(242, 201, 76, 0.4);
    }

    .why-icon {
      width: 34px;
      height: 34px;
      border-radius: 999px;
      background: radial-gradient(circle at top, rgba(0, 176, 80, 0.55), rgba(2, 10, 6, 0.65));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      margin-bottom: 0.3rem;
    }

    .why-title {
      font-size: 1.05rem;
      font-weight: 600;
    }

    .why-text {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    /* ========== COMO FUNCIONA ========== */

    .steps-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 1.1rem;
    }

    @media (max-width: 1000px) {
      .steps-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      .steps-grid {
        grid-template-columns: 1fr;
      }
    }

    .step-card {
      background: linear-gradient(150deg, #0f2519, #07140d);
      border-radius: var(--radius-lg);
      padding: 1.3rem 1.1rem 1.2rem;
      border: 1px solid rgba(0, 255, 128, 0.26);
      box-shadow: var(--shadow-card);
      font-size: 0.9rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      transition:
        transform 0.16s ease-out,
        box-shadow 0.16s ease-out,
        border-color 0.16s ease-out;
    }

    .step-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 18px 36px rgba(0, 0, 0, 0.78);
      border-color: rgba(242, 201, 76, 0.6);
    }

    .step-number {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--secondary);
    }

    .step-title {
      font-weight: 600;
      font-size: 1rem;
    }

    .step-text {
      color: var(--text-muted);
      font-size: 0.88rem;
    }

    /* ========== CONTEÚDO DO CURSO ========== */

    .content-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 2.3rem;
      align-items: flex-start;
    }

    @media (max-width: 900px) {
      .content-grid {
        grid-template-columns: 1fr;
      }
    }

    .content-card {
      background: rgba(5, 33, 19, 0.96);
      border-radius: var(--radius-lg);
      padding: 1.7rem 1.5rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: var(--shadow-card);
    }

    .content-card h3 {
      font-size: 1.05rem;
      margin-bottom: 0.7rem;
    }

    .content-card p {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 0.9rem;
    }

    .bullet-list {
      list-style: none;
      padding-left: 0;
      font-size: 0.9rem;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .bullet-list li::before {
      content: "✔";
      color: var(--primary-soft);
      margin-right: 0.45rem;
      font-size: 0.8rem;
    }

    /* ========== SLIDER GENÉRICO ========== */

    .slider-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 38px;
      height: 38px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.3rem;
      color: var(--text-main);
      z-index: 3;
      transition:
        background 0.12s ease-out,
        transform 0.12s ease-out,
        border-color 0.12s ease-out,
        opacity 0.12s ease-out;
    }

    .slider-arrow-left {
      left: 0.5rem;
    }

    .slider-arrow-right {
      right: 0.5rem;
    }

    .slider-arrow:hover {
      background: rgba(0, 0, 0, 0.85);
      border-color: var(--secondary);
      transform: translateY(-50%) scale(1.03);
    }

    @media (max-width: 640px) {
      .slider-arrow {
        display: none;
      }
    }

    /* ========== TURMAS EM AÇÃO (SLIDER FOTOS) ========== */

    .drone-gallery-slider {
      position: relative;
      max-width: 600px;
      margin: 0 auto;
      min-height: 600px;
    }

    .drone-gallery-slider .gallery-card {
      position: absolute;
      inset: 0;
      opacity: 0;
      pointer-events: none;
      transition:
        opacity 0.45s ease-out,
        transform 0.45s ease-out,
        border-color 0.16s ease-out;
      transform: translateY(6px);
    }

    .drone-gallery-slider .gallery-card.active {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .gallery-card {
      background: #07140d;
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      min-height: 100%;
      box-shadow: var(--shadow-card);
    }

    .gallery-card-image {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 4;
      max-height: 900px;
      overflow: hidden;
    }

    @media (max-width: 640px) {
      .gallery-card-image {
        aspect-ratio: 4 / 3;
      }
    }

    .gallery-card-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease-out;
    }

    .drone-gallery-slider .gallery-card:hover img {
      transform: scale(1.06);
    }

    .img-inseminacao-gallery-1 {
      object-position: 50% 40%;
    }
    .img-inseminacao-gallery-2 {
      object-position: 50% 45%;
    }
    .img-inseminacao-gallery-3 {
      object-position: 50% 40%;
    }
    .img-inseminacao-gallery-4 {
      object-position: 50% 40%;
    }
    .img-inseminacao-gallery-5 {
      object-position: 50% 45%;
    }
    .img-inseminacao-gallery-6 {
      object-position: 50% 40%;
    }

    .gallery-card-body {
      padding: 0.95rem 1.05rem 1.2rem;
      font-size: 0.88rem;
    }

    .gallery-card-title {
      font-size: 0.98rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    .gallery-card-text {
      color: var(--text-muted);
    }

    .gallery-dots {
      margin-top: 1.2rem;
      display: flex;
      justify-content: center;
      gap: 0.4rem;
    }

    .gallery-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      border: none;
      background: rgba(255, 255, 255, 0.25);
      cursor: pointer;
      padding: 0;
    }

    .gallery-dot.active {
      background: var(--secondary);
    }

    /* ========== DEPOIMENTOS TEXTO ========== */

    .testimonials-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1.3rem;
    }

    @media (max-width: 992px) {
      .testimonials-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      .testimonials-grid {
        grid-template-columns: 1fr;
      }
    }

    .testimonial-card {
      background: rgba(5, 33, 19, 0.96);
      border-radius: var(--radius-md);
      padding: 1.4rem 1.3rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.45);
      font-size: 0.9rem;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      position: relative;
      overflow: hidden;
    }

    .testimonial-card::before {
      content: "“";
      position: absolute;
      top: -0.5rem;
      right: 0.8rem;
      font-size: 3.8rem;
      color: rgba(242, 201, 76, 0.18);
      pointer-events: none;
    }

    .testimonial-text {
      color: var(--text-muted);
    }

    .testimonial-author {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-top: 0.2rem;
    }

    .testimonial-avatar {
      width: 34px;
      height: 34px;
      border-radius: 999px;
      background: radial-gradient(circle at top, rgba(0, 176, 80, 0.7), rgba(2, 10, 6, 0.9));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .testimonial-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .testimonial-meta strong {
      display: block;
      color: var(--text-main);
    }

    /* ========== DEPOIMENTOS EM VÍDEO - CORRIGIDO ========== */

    .video-slider {
      position: relative;
      max-width: 1200px;
      margin: 0 auto;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1.3rem;
    }

    @media (max-width: 992px) {
      .video-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      .video-grid {
        grid-template-columns: 1fr;
      }
    }

    .video-card {
      background: #07140d;
      border-radius: var(--radius-lg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 0.9rem 0.9rem 1.1rem;
      box-shadow: var(--shadow-card);
      font-size: 0.86rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      height: 100%;
    }

    /* CORREÇÃO APLICADA: TAMANHO CONSISTENTE PARA OS VÍDEOS */
    .video-card video {
      width: 100%;
      min-height: 180px;
      max-height: 220px;
      aspect-ratio: 16/9;
      border-radius: var(--radius-md);
      display: block;
      margin-bottom: 0.6rem;
      background: #000;
      object-fit: cover;
      transition: all 0.3s ease;
    }

    .video-card video:hover {
      transform: scale(1.02);
    }

    .video-card video:fullscreen {
      object-fit: contain;
    }

    /* Melhorar controles dos vídeos */
    .video-card video::-webkit-media-controls-panel {
      background: rgba(0,0,0,0.7);
    }

    .video-card video::-webkit-media-controls-play-button {
      color: var(--primary);
    }

    .video-card-title {
      font-weight: 600;
      margin-bottom: 0.1rem;
      font-size: 0.9rem;
    }

    .video-card-text {
